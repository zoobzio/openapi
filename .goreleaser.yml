# GoReleaser configuration for openapi - OpenAPI 3.0 specification library
# This configuration is optimized for a library package (no binaries)

version: 2

# Set project name
project_name: openapi

# Build configuration
builds:
  # Skip building binaries for the library package
  - skip: true

# Archive configuration
archives:
  - id: source
    files:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "README.md"
      - "Makefile"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".golangci.yml"
    name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# Checksum configuration
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 7
  groups:
    - title: "✨ Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "⚡ Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "♻️ Refactoring"
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "📚 Documentation"
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "🧪 Testing"
      regexp: '^.*?test(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: "🔧 Maintenance"
      regexp: '^.*?chore(\([[:word:]]+\))??!?:.+$'
      order: 6
    - title: "🏗️ Build System"
      regexp: '^.*?build(\([[:word:]]+\))??!?:.+$'
      order: 7
    - title: "📦 Dependencies"
      regexp: '^.*?deps?(\([[:word:]]+\))??!?:.+$'
      order: 8
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^Merge"
      - "^merge"
      - "^wip"
      - "^WIP"

# Release configuration
release:
  github:
    owner: zoobzio
    name: openapi

  name_template: "{{ .ProjectName }} v{{ .Version }}"
  draft: false
  prerelease: auto
  mode: append

  header: |
    ## openapi v{{ .Version }}

    Complete OpenAPI 3.0 specification implementation for Go.

    ### Installation

    ```bash
    go get github.com/zoobzio/openapi@v{{ .Version }}
    ```

    ### Requirements
    - Go 1.23 or higher

  footer: |
    ---

    **Full Documentation:** https://github.com/zoobzio/openapi/blob/v{{ .Version }}/README.md

    Thanks to all contributors!

# Announce releases
announce:
  skip: true

# Snapshot configuration
snapshot:
  version_template: "{{ .Tag }}-next"

# Source configuration
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# Git configuration
git:
  tag_sort: -version:refname
  ignore_tags:
    - ".*-rc.*"
    - ".*-beta.*"
    - ".*-alpha.*"
